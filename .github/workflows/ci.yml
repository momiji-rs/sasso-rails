name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (ruby ${{ matrix.ruby }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # Ruby 3.1 is unsupported, not merely untested: the `sasso` engine gem
        # requires >= 3.2 as of 0.14.0, so no dep set resolves on 3.1. (The
        # current Rails dep tree independently pulls nokogiri >= 1.19, which
        # wants >= 3.2 too.) See required_ruby_version in the gemspec.
        # Ruby 4.0 needs `sasso` >= 0.14.1, the first release with a precompiled
        # 4.0 binary (0.14.0's source gem does not build on 4.0); bundler resolves
        # a newer one here regardless of the gemspec floor.
        ruby: ["3.2", "3.3", "3.4", "4.0"]
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true   # bundle install (pulls railties + precompiled sasso) + cache
      - run: bundle exec rake
